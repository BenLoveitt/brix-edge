# Runs when a tag v<version> is pushed. It publishes, on the GitHub release:
#   brix-edge-<version>.tar.gz      the source at the tag (git archive, gzip -n)
#   brix-edge-<version>.cdx.json    CycloneDX SBOM: brix-edge and zero dependencies
#   SHA256SUMS                      checksums of the two files above
#   image-digest.txt                the digest scripts/reproduce.sh gives at the tag
# and a signed GitHub artifact attestation (SLSA build provenance) for each
# file and for the image digest. No image is pushed anywhere: you build it, and
# compare your digest with ours. Check an attestation with
#   gh attestation verify <file> --repo BenLoveitt/brix-edge
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release
      id-token: write      # sign the attestations (Sigstore, no stored key)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: The tag matches the version everywhere
        run: |
          v="${GITHUB_REF_NAME#v}"
          node -e 'const v=process.argv[1];const p=require("./package.json").version;if(p!==v){console.error("package.json "+p+" != tag "+v);process.exit(1)}' "$v"
          grep -q "export const VERSION = \"$v\"" src/server.mjs
          grep -q "^## $v " CHANGELOG.md
          grep -q "brix-edge:$v" README.md
      - run: node --test
      - run: scripts/egress-proof.sh
      - name: Source archive, SBOM and checksums
        run: |
          v="${GITHUB_REF_NAME#v}"
          mkdir dist
          git archive --format=tar --prefix="brix-edge-$v/" "$GITHUB_REF_NAME" | gzip -n -9 > "dist/brix-edge-$v.tar.gz"
          npm sbom --sbom-format cyclonedx --omit dev > "dist/brix-edge-$v.cdx.json"
          node -e 'const b=require("./dist/brix-edge-'"$v"'.cdx.json");const n=(b.components||[]).length;if(n){console.error(n+" components");process.exit(1)}'
          (cd dist && sha256sum "brix-edge-$v.tar.gz" "brix-edge-$v.cdx.json" > SHA256SUMS)
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Reproducible image digest (built twice)
        id: image
        run: |
          a="$(scripts/reproduce.sh)"; b="$(scripts/reproduce.sh)"
          test "$a" = "$b"
          echo "$a" > dist/image-digest.txt
          echo "digest=$a" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/brix-edge-*.tar.gz, dist/brix-edge-*.cdx.json, dist/SHA256SUMS, dist/image-digest.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: brix-edge
          subject-digest: ${{ steps.image.outputs.digest }}
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          {
            echo "See CHANGELOG.md for what changed."
            echo
            echo "Image digest from \`scripts/reproduce.sh\` at this tag (linux/amd64): \`${{ steps.image.outputs.digest }}\`"
            echo
            echo "Check a file: \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`"
            echo
            echo '```'; cat dist/SHA256SUMS; echo '```'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "brix-edge $v" --notes-file notes.md --verify-tag
